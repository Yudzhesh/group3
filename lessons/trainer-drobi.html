<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Северное Сияние · Кампус</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Lora', serif; background: #F4F6F8; color: #2C3338; margin: 0; padding: 0; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
  .header { background: #1AA6C4; color: #fff; padding: 20px 30px; box-shadow: 0 2px 10px rgba(26, 166, 196, 0.2); }
  .brand { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700; }
  .brand span { font-weight: 400; opacity: 0.8; }
  
  .container { max-width: 800px; margin: 60px auto; padding: 0 20px; flex: 1; text-align: center; }
  h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; margin-bottom: 40px; color: #1A2024; }
  
  .groups-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  
  .group-card { 
    background: #fff; border-radius: 16px; padding: 40px 30px; width: 300px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-decoration: none; color: inherit;
    transition: transform 0.2s, box-shadow 0.2s; border: 2px solid transparent;
  }
  .group-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(26, 166, 196, 0.15); border-color: #1AA6C4; }
  
  .group-icon { font-size: 48px; margin-bottom: 20px; }
  .group-name { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 700; color: #1AA6C4; margin-bottom: 10px; }
  .group-desc { font-size: 15px; color: #6B7785; }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">Северное Сияние <span>· Кампус</span></div>
  </div>
  
  <div class="container">
    <h1>Выберите группу</h1>
    
    <div class="groups-grid">
      <!-- Карточка Группы 2 -->
      <a href="group-2/index.html" class="group-card">
        <div class="group-icon">📚</div>
        <div class="group-name">Группа 2</div>
        <div class="group-desc">Материалы уроков и задания для второй группы.</div>
      </a>

      <!-- Карточка Группы 3 -->
      <a href="group-3/index.html" class="group-card">
        <div class="group-icon">🎓</div>
        <div class="group-name">Группа 3</div>
        <div class="group-desc">Тренажеры и материалы для 6–7 классов.</div>
      </a>
    </div>
  </div>
</body>
</html>
